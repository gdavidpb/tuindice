name: Set up iOS build environment
description: >
  Shared iOS build setup for preflight and deploy: selects Xcode, restores
  Kotlin/Native and CocoaPods caches, optionally restores the device release
  framework cache, and installs Java, Gradle, and CocoaPods dependencies.
  Keeping this in one place prevents the two workflows from drifting.

inputs:
  xcode-app:
    description: Xcode application bundle name under /Applications.
    required: false
    default: Xcode_26.5
  java-version:
    description: Temurin Java version used by Gradle.
    required: false
    default: "21"
  cache-device-framework:
    description: Whether to restore/save the iOS device release framework cache.
    required: false
    default: "true"
  cache-read-only:
    description: >
      Whether the Gradle User Home cache is read-only for this job. Defaults to
      writable: production jobs publish shared entries and PR jobs publish
      PR-scoped entries so repeated pushes reuse prior outputs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Xcode
      shell: bash
      run: |
        set -euo pipefail
        sudo xcode-select -s "/Applications/${{ inputs.xcode-app }}.app/Contents/Developer"
        xcodebuild -version

    - name: Resolve iOS cache metadata
      id: ios-cache-metadata
      shell: bash
      run: |
        set -euo pipefail
        xcode_cache_id="$(
          xcodebuild -version \
            | tr '\n' ' ' \
            | sed -E 's/[[:space:]]+/ /g; s/[[:space:]]+$//; s/[[:space:]]/-/g'
        )"
        kotlin_version="$(
          sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1
        )"
        framework_hash="$(bash ./.github/scripts/ios-framework-cache-key.sh)"
        echo "xcode=${xcode_cache_id}" >> "$GITHUB_OUTPUT"
        echo "kotlin=${kotlin_version}" >> "$GITHUB_OUTPUT"
        echo "framework_hash=${framework_hash}" >> "$GITHUB_OUTPUT"

    - name: Cache iOS native dependencies
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.konan/cache
          ~/.konan/dependencies
          ~/.konan/kotlin-native-prebuilt-*
          ~/Library/Caches/CocoaPods
          iosApp/Pods
        key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'iosApp/Podfile.lock') }}
        restore-keys: |
          ios-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-

    - name: Cache iOS device release framework
      id: ios-device-framework-cache
      if: inputs.cache-device-framework == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: maincore/build/bin/iosArm64/releaseFramework/maincore.framework
        key: ios-framework-device-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-${{ steps.ios-cache-metadata.outputs.framework_hash }}

    - name: Enable cached iOS device framework
      if: steps.ios-device-framework-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "TUINDICE_IOS_USE_CACHED_FRAMEWORK=1" >> "$GITHUB_ENV"

    - name: Set up Java
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-cleanup: on-success

    - name: Install CocoaPods dependencies
      shell: bash
      run: |
        set -euo pipefail
        if command -v pod >/dev/null 2>&1; then
          (cd iosApp && pod install)
        else
          echo "CocoaPods is not installed on this runner." >&2
          exit 1
        fi
