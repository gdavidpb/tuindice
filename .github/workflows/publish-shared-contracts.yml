name: Publish shared contracts

# Publishes the shared contracts (academiccore and chatcontract, for the JVM backend and every Kotlin target) to the
# Artifact Registry. A contracts-vX.Y.Z tag publishes the version it names; a manual run publishes the version declared
# in gradle.properties of the selected commit. See docs/shared-contracts.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "contracts-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish-contracts:
    name: Publish shared contracts
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Check that the tag matches the contracts version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A manual run publishes the version that the checked-out commit declares.
          if [[ "$REF_TYPE" != "tag" ]]; then
            exit 0
          fi

          if [[ ! "$REF_NAME" =~ ^contracts-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'Tag %s is not contracts-vX.Y.Z.\n' "$REF_NAME" >&2
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"

          declared_version="$(sed -n 's/^tuindice\.contracts\.version=//p' gradle.properties)"
          if [[ "$tag_version" != "$declared_version" ]]; then
            printf 'Tag %s does not match tuindice.contracts.version=%s in gradle.properties.\n' \
              "$REF_NAME" "$declared_version" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CONTRACTS_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Publish shared contracts
        run: |
          set -euo pipefail

          # The Gradle build declares the Artifact Registry repository only when this variable is set.
          artifact_registry_token="$(gcloud auth print-access-token)"
          printf '::add-mask::%s\n' "$artifact_registry_token"
          export ARTIFACT_REGISTRY_TOKEN="$artifact_registry_token"

          # Not run through run-gradle-with-retry.sh: a retry after a partial upload would publish the same version again.
          ./gradlew --console=plain :academiccore:publish :chatcontract:publish
