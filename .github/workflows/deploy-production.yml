name: Deploy production

on:
  workflow_run:
    workflows:
      - Stage production artifacts
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_sha:
        description: Production commit SHA to deploy. Defaults to the current workflow SHA.
        required: false
        type: string

# Deploys queue instead of cancelling: an interrupted upload must finish (it
# is idempotent) before the next deploy is evaluated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  statuses: write

env:
  GCP_PROJECT: tu-indice-usb
  ANDROID_PACKAGE_NAME: com.gdavidpb.tuindice
  GOOGLE_PLAY_TRACK: production
  PRODUCTION_RELEASE_ARTIFACT_DIR: build/production-release
  PRODUCTION_BRANCH: production
  STAGE_ARTIFACT_JOB_NAME: Assemble production release artifact
  TUINDICE_UPLOAD_CRASHLYTICS_MAPPING: "1"

jobs:
  resolve-artifact:
    name: Resolve production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      stage_run_id: ${{ steps.resolve.outputs.stage_run_id }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}

    steps:
      - name: Resolve staged artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          GH_EVENT_NAME: ${{ github.event_name }}
          DEFAULT_TARGET_SHA: ${{ github.sha }}
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          api_get() {
            local url="$1"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          # The staged artifact is what the deploy consumes: bookkeeping jobs in
          # the stage run must not be able to veto a release.
          stage_artifact_job_succeeded() {
            local run_id="$1"
            local jobs_response

            jobs_response="$(api_get "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")" || {
              printf 'Unable to read the jobs of stage run %s.\n' "$run_id" >&2
              exit 1
            }

            jq -e \
              --arg job_name "$STAGE_ARTIFACT_JOB_NAME" \
              'any(.jobs[]?; .name == $job_name and .conclusion == "success")' \
              <<<"$jobs_response" >/dev/null
          }

          skip_deploy() {
            printf '%s\n' "$1"
            printf 'should_deploy=false\n' >>"$GITHUB_OUTPUT"
            printf 'target_sha=%s\n' "$target_sha" >>"$GITHUB_OUTPUT"
            printf 'stage_run_id=%s\n' "$stage_run_id" >>"$GITHUB_OUTPUT"
            printf 'artifact_name=%s\n' "$artifact_name" >>"$GITHUB_OUTPUT"
            exit 0
          }

          target_sha="${DISPATCH_TARGET_SHA:-$DEFAULT_TARGET_SHA}"
          stage_run_id=""
          artifact_name=""
          allow_missing=0

          if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
            target_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
            stage_run_id="$(jq -r '.workflow_run.id // empty' "$GITHUB_EVENT_PATH")"
            allow_missing=1
          fi

          [[ -n "$target_sha" ]] || {
            printf 'Unable to resolve target SHA.\n' >&2
            exit 1
          }

          # Deploys queue by stage completion order, not by commit order: only
          # the current branch tip may publish and tag.
          production_tip_sha=""
          if tip_response="$(api_get "${GH_API_URL}/repos/${GH_REPOSITORY}/git/ref/heads/${PRODUCTION_BRANCH}")"; then
            production_tip_sha="$(jq -r '.object.sha // empty' <<<"$tip_response")"
          fi

          if [[ -n "$production_tip_sha" && "$production_tip_sha" != "$target_sha" ]]; then
            skip_deploy "$(printf '%s is no longer the %s tip (%s); deploy will be skipped.' "$target_sha" "$PRODUCTION_BRANCH" "$production_tip_sha")"
          fi

          artifact_name="production-release-${target_sha}"

          if [[ -n "$stage_run_id" ]]; then
            stage_artifact_job_succeeded "$stage_run_id" || skip_deploy "$(printf 'Stage run %s did not produce a successful "%s" job; deploy will be skipped.' "$stage_run_id" "$STAGE_ARTIFACT_JOB_NAME")"
          else
            runs_response="$(api_get "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/workflows/stage-production-artifacts.yml/runs?branch=${PRODUCTION_BRANCH}&status=completed&per_page=100")"
            while IFS= read -r candidate_run_id; do
              [[ -n "$candidate_run_id" ]] || continue
              if stage_artifact_job_succeeded "$candidate_run_id"; then
                stage_run_id="$candidate_run_id"
                break
              fi
            done < <(
              jq -r \
                --arg target_sha "$target_sha" \
                '.workflow_runs[]? | select(.head_sha == $target_sha) | .id' \
                <<<"$runs_response"
            )
          fi

          if [[ -n "$stage_run_id" ]]; then
            artifacts_response="$(api_get "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/runs/${stage_run_id}/artifacts?per_page=100")"
            artifact_found="$(
              jq -r \
                --arg artifact_name "$artifact_name" \
                '[
                  .artifacts[]?
                  | select(.name == $artifact_name)
                  | select(.expired == false)
                  | .id
                ][0] // empty' \
                <<<"$artifacts_response"
            )"
          else
            artifact_found=""
          fi

          if [[ -z "$artifact_found" ]]; then
            if [[ "$allow_missing" == "1" ]]; then
              skip_deploy "$(printf 'No staged production artifact found for %s in stage run %s; deploy will be skipped.' "$target_sha" "${stage_run_id:-<none>}")"
            fi
            printf 'Missing staged production artifact %s for %s.\n' "$artifact_name" "$target_sha" >&2
            exit 1
          fi

          printf 'should_deploy=true\n' >>"$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >>"$GITHUB_OUTPUT"
          printf 'stage_run_id=%s\n' "$stage_run_id" >>"$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >>"$GITHUB_OUTPUT"

  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-24.04
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.should_deploy == 'true'
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-artifact.outputs.target_sha }}
          fetch-depth: 0

      - name: Download production release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-artifact.outputs.artifact_name }}
          run-id: ${{ needs.resolve-artifact.outputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.PRODUCTION_RELEASE_ARTIFACT_DIR }}

      - name: Validate production release artifact
        env:
          TARGET_GIT_SHA: ${{ needs.resolve-artifact.outputs.target_sha }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/production-release-artifact.sh validate-manifest

      - name: Authenticate to Google Cloud for Play publishing
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload Android draft from staged artifact
        env:
          TARGET_GIT_SHA: ${{ needs.resolve-artifact.outputs.target_sha }}
          DEPLOY_PRODUCTION_PHASE: android
          ANDROID_PUBLISHER_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh

      - name: Set up Java for the Crashlytics mapping upload
        if: env.TUINDICE_UPLOAD_CRASHLYTICS_MAPPING == '1'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      # Deploy-time bookkeeping: the mapping never blocks a release that the
      # stores already accepted.
      - name: Upload Crashlytics mapping file
        if: env.TUINDICE_UPLOAD_CRASHLYTICS_MAPPING == '1'
        continue-on-error: true
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mapping_file="${PRODUCTION_RELEASE_ARTIFACT_DIR}/android/mapping.txt"
          mapping_file_id_resource="${PRODUCTION_RELEASE_ARTIFACT_DIR}/android/com_google_firebase_crashlytics_mappingfileid.xml"

          if [[ ! -s "$mapping_file" || ! -s "$mapping_file_id_resource" ]]; then
            printf 'Staged Crashlytics mapping inputs are incomplete; nothing to upload.\n' >&2
            exit 1
          fi

          REQUIRE_ANDROID_FIREBASE_CONFIG=1 bash ./.github/scripts/materialize-firebase-configs.sh

          firebase_app_id="$(
            jq -r \
              --arg package_name "$ANDROID_PACKAGE_NAME" \
              '[
                .client[]?
                | select(.client_info.android_client_info.package_name == $package_name)
                | .client_info.mobilesdk_app_id
              ][0] // empty' \
              app/google-services.json
          )"
          [[ -n "$firebase_app_id" ]] || {
            printf 'Unable to resolve the Firebase app id for %s.\n' "$ANDROID_PACKAGE_NAME" >&2
            exit 1
          }

          buildtools_version="$(
            awk -F'=' '$1 ~ /^[[:space:]]*firebase-crashlytics-gradle[[:space:]]*$/ {
              gsub(/[[:space:]"]/, "", $2)
              print $2
              exit
            }' gradle/libs.versions.toml
          )"
          [[ -n "$buildtools_version" ]] || {
            printf 'Unable to resolve the Crashlytics buildtools version.\n' >&2
            exit 1
          }

          buildtools_jar="${RUNNER_TEMP}/firebase-crashlytics-buildtools.jar"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$buildtools_jar" \
            "https://dl.google.com/dl/android/maven2/com/google/firebase/firebase-crashlytics-buildtools/${buildtools_version}/firebase-crashlytics-buildtools-${buildtools_version}.jar"

          java -jar "$buildtools_jar" \
            -uploadMappingFile "$mapping_file" \
            -resourceFile "$mapping_file_id_resource" \
            -googleAppId "$firebase_app_id" \
            -androidApplicationId "$ANDROID_PACKAGE_NAME"

  deploy-ios:
    name: Deploy iOS
    runs-on: macos-26
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.should_deploy == 'true'
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-artifact.outputs.target_sha }}
          fetch-depth: 0

      - name: Download production release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-artifact.outputs.artifact_name }}
          run-id: ${{ needs.resolve-artifact.outputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.PRODUCTION_RELEASE_ARTIFACT_DIR }}

      - name: Validate production release artifact
        env:
          TARGET_GIT_SHA: ${{ needs.resolve-artifact.outputs.target_sha }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/production-release-artifact.sh validate-manifest

      - name: Upload iOS build from staged artifact
        env:
          TARGET_GIT_SHA: ${{ needs.resolve-artifact.outputs.target_sha }}
          DEPLOY_PRODUCTION_PHASE: ios
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh

  tag-release:
    name: Tag release
    runs-on: ubuntu-24.04
    needs:
      - resolve-artifact
      - deploy-android
      - deploy-ios
    if: needs.resolve-artifact.outputs.should_deploy == 'true'
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-artifact.outputs.target_sha }}
          fetch-depth: 0

      - name: Configure git identity for release tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release tag
        env:
          TARGET_GIT_SHA: ${{ needs.resolve-artifact.outputs.target_sha }}
          DEPLOY_PRODUCTION_PHASE: tag
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh
