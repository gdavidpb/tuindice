name: Deploy production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  statuses: read

env:
  GCP_PROJECT: tu-indice-usb
  ANDROID_PACKAGE_NAME: com.gdavidpb.tuindice
  GOOGLE_PLAY_TRACK: production

jobs:
  deploy-preflight:
    name: Deploy preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Run deploy preflight
        env:
          TARGET_GIT_SHA: ${{ github.sha }}
          DEPLOY_PRODUCTION_PHASE: preflight
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh

  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-24.04
    needs: deploy-preflight
    environment: production
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud for Play publishing
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Check Android draft exists
        id: android-draft-check
        env:
          GOOGLE_PLAY_CHECK_ONLY: "1"
          ANDROID_PUBLISHER_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/publish-google-play-draft.sh

      - name: Set up Java
        if: steps.android-draft-check.outputs.android_draft_exists != 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.android-draft-check.outputs.android_draft_exists != 'true'
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build and upload Android draft
        if: steps.android-draft-check.outputs.android_draft_exists != 'true'
        env:
          TARGET_GIT_SHA: ${{ github.sha }}
          DEPLOY_PRODUCTION_PHASE: android
          ANDROID_PUBLISHER_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          TU_INDICE_KEY_ALIAS: ${{ secrets.TU_INDICE_KEY_ALIAS }}
          TU_INDICE_KEY_PASSWORD: ${{ secrets.TU_INDICE_KEY_PASSWORD }}
          TU_INDICE_KEY_STORE_PASSWORD: ${{ secrets.TU_INDICE_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh

  deploy-ios:
    name: Deploy iOS
    runs-on: macos-26
    needs: deploy-preflight
    environment: production
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check App Store Connect build exists
        id: ios-build-check
        env:
          APP_STORE_CONNECT_CHECK_ONLY: "1"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          bash ./iosApp/scripts/ci-upload-ios-appstore.sh

      - name: Set up Xcode
        if: steps.ios-build-check.outputs.ios_build_exists != 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Set up Java
        if: steps.ios-build-check.outputs.ios_build_exists != 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.ios-build-check.outputs.ios_build_exists != 'true'
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Install CocoaPods dependencies
        if: steps.ios-build-check.outputs.ios_build_exists != 'true'
        run: |
          set -euo pipefail
          if command -v pod >/dev/null 2>&1; then
            (cd iosApp && pod install)
          else
            echo "CocoaPods is not installed on this runner." >&2
            exit 1
          fi

      - name: Build and upload iOS build
        if: steps.ios-build-check.outputs.ios_build_exists != 'true'
        env:
          TARGET_GIT_SHA: ${{ github.sha }}
          DEPLOY_PRODUCTION_PHASE: ios
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TUINDICE_UPLOAD_CRASHLYTICS_MAPPING: "1"
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh

  tag-release:
    name: Tag release
    runs-on: ubuntu-24.04
    needs:
      - deploy-android
      - deploy-ios
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure git identity for release tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release tag
        env:
          TARGET_GIT_SHA: ${{ github.sha }}
          DEPLOY_PRODUCTION_PHASE: tag
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy-production.sh
