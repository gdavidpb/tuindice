name: Preflight production PR

on:
  pull_request:
    branches:
      - production

concurrency:
  group: preflight-production-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  shared-preflight:
    name: Shared preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android_tasks: ${{ steps.changes.outputs.android_tasks }}
      ios_tasks: ${{ steps.changes.outputs.ios_tasks }}
      ios_ci_scripts_touched: ${{ steps.changes.outputs.ios_ci_scripts_touched }}
      has_relevant_changes: ${{ steps.changes.outputs.has_relevant_changes }}
      app_version_changed: ${{ steps.changes.outputs.app_version_changed }}
      has_release_impact: ${{ steps.changes.outputs.has_release_impact }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect changed app pieces
        id: changes
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          echo "Using merge base ${merge_base} for PR preflight diff."
          STATE_DIR="${RUNNER_TEMP}/tuindice-changes" \
            bash ./.github/scripts/detect-changed-app.sh "$merge_base" "${{ github.event.pull_request.head.sha }}"

      - name: Skip shared preflight when there are no relevant changes
        if: steps.changes.outputs.has_relevant_changes != 'true'
        run: |
          set -euo pipefail
          {
            echo "## Production preflight summary"
            echo
            echo "- No deployable app changes were detected."
            echo "- Workflow finished successfully without validations."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate CI/CD configuration
        if: steps.changes.outputs.ci_config_touched == 'true'
        run: |
          set -euo pipefail
          bash ./.github/scripts/validate-ci-config.sh

      - name: Run shared release preflight checks
        if: steps.changes.outputs.has_relevant_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          MISSING_VERSION_BUMP_FILE: ${{ steps.changes.outputs.missing_version_bump_file }}
          E2E_ANDROID_CONTEXTS_FILE: ${{ steps.changes.outputs.e2e_android_contexts_file }}
          E2E_IOS_CONTEXTS_FILE: ${{ steps.changes.outputs.e2e_ios_contexts_file }}
          REQUIRES_E2E_CERTIFICATION: ${{ steps.changes.outputs.requires_e2e_certification }}
          HAS_RELEVANT_CHANGES: ${{ steps.changes.outputs.has_relevant_changes }}
          APP_VERSION_CHANGED: ${{ steps.changes.outputs.app_version_changed }}
          HAS_RELEASE_IMPACT: ${{ steps.changes.outputs.has_release_impact }}
          E2E_REUSE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/preflight-production.sh

  android-preflight:
    name: Android preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - shared-preflight
    if: ${{ !cancelled() && needs.shared-preflight.result == 'success' && needs.shared-preflight.outputs.android_tasks != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Materialize Firebase configuration
        if: contains(needs.shared-preflight.outputs.android_tasks, ':app:bundleRelease')
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          REQUIRE_FIREBASE_CONFIGS=1 bash ./.github/scripts/materialize-firebase-configs.sh

      - name: Materialize Android release signing
        if: contains(needs.shared-preflight.outputs.android_tasks, ':app:bundleRelease')
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          TU_INDICE_KEY_ALIAS: ${{ secrets.TU_INDICE_KEY_ALIAS }}
          TU_INDICE_KEY_PASSWORD: ${{ secrets.TU_INDICE_KEY_PASSWORD }}
          TU_INDICE_KEY_STORE_PASSWORD: ${{ secrets.TU_INDICE_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/materialize-android-signing.sh

      - name: Run focused Android checks
        env:
          TU_INDICE_KEY_ALIAS: ${{ secrets.TU_INDICE_KEY_ALIAS }}
          TU_INDICE_KEY_PASSWORD: ${{ secrets.TU_INDICE_KEY_PASSWORD }}
          TU_INDICE_KEY_STORE_PASSWORD: ${{ secrets.TU_INDICE_KEY_STORE_PASSWORD }}
          SKIP_APP_VERSION_TAG_CONFLICT_CHECK: ${{ (needs.shared-preflight.outputs.app_version_changed != 'true' && needs.shared-preflight.outputs.has_release_impact != 'true') && '1' || '0' }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/run-gradle-with-retry.sh \
            ./gradlew --continue --console=plain --max-workers=2 ${{ needs.shared-preflight.outputs.android_tasks }}

  ios-preflight:
    name: iOS preflight
    runs-on: macos-26
    timeout-minutes: 90
    needs:
      - shared-preflight
    if: ${{ !cancelled() && needs.shared-preflight.result == 'success' && (needs.shared-preflight.outputs.ios_tasks != '' || needs.shared-preflight.outputs.ios_ci_scripts_touched == 'true') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run iOS CI script smoke checks
        if: needs.shared-preflight.outputs.ios_ci_scripts_touched == 'true'
        run: |
          set -euo pipefail
          bash ./.github/scripts/test-appstore-connect-check.sh

      - name: Set up Xcode
        if: needs.shared-preflight.outputs.ios_tasks != ''
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Resolve iOS cache metadata
        id: ios-cache-metadata
        if: needs.shared-preflight.outputs.ios_tasks != ''
        run: |
          set -euo pipefail
          xcode_cache_id="$(
            xcodebuild -version \
              | tr '\n' ' ' \
              | sed -E 's/[[:space:]]+/ /g; s/[[:space:]]+$//; s/[[:space:]]/-/g'
          )"
          kotlin_version="$(
            sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1
          )"
          framework_hash="$(bash ./.github/scripts/ios-framework-cache-key.sh)"
          echo "xcode=${xcode_cache_id}" >> "$GITHUB_OUTPUT"
          echo "kotlin=${kotlin_version}" >> "$GITHUB_OUTPUT"
          echo "framework_hash=${framework_hash}" >> "$GITHUB_OUTPUT"

      - name: Cache iOS native dependencies
        if: needs.shared-preflight.outputs.ios_tasks != ''
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.konan/cache
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
            ~/Library/Caches/CocoaPods
            iosApp/Pods
          key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'iosApp/Podfile.lock') }}
          restore-keys: |
            ios-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-

      - name: Cache iOS device release framework
        id: ios-device-framework-cache
        if: contains(needs.shared-preflight.outputs.ios_tasks, 'verifyIosHostBuildDeviceRelease')
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: maincore/build/bin/iosArm64/releaseFramework/maincore.framework
          key: ios-framework-device-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-metadata.outputs.xcode }}-kotlin-${{ steps.ios-cache-metadata.outputs.kotlin }}-${{ steps.ios-cache-metadata.outputs.framework_hash }}

      - name: Enable cached iOS device framework
        if: steps.ios-device-framework-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          echo "TUINDICE_IOS_USE_CACHED_FRAMEWORK=1" >> "$GITHUB_ENV"

      - name: Set up Java
        if: needs.shared-preflight.outputs.ios_tasks != ''
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: needs.shared-preflight.outputs.ios_tasks != ''
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Install CocoaPods dependencies
        if: needs.shared-preflight.outputs.ios_tasks != ''
        run: |
          set -euo pipefail
          if command -v pod >/dev/null 2>&1; then
            (cd iosApp && pod install)
          else
            echo "CocoaPods is not installed on this runner." >&2
            exit 1
          fi

      - name: Materialize Firebase configuration
        if: contains(needs.shared-preflight.outputs.ios_tasks, 'verifyIosHostBuildDeviceRelease')
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          REQUIRE_FIREBASE_CONFIGS=1 bash ./.github/scripts/materialize-firebase-configs.sh

      - name: Run focused iOS checks
        if: needs.shared-preflight.outputs.ios_tasks != ''
        env:
          TUINDICE_IOS_HOST_BUILD: "1"
          TUINDICE_IOS_HOST_E2E: "1"
          PLATFORM_NAME: iphoneos
          ARCHS: arm64
          BUILT_PRODUCTS_DIR: ${{ github.workspace }}/iosApp/.build/ios-host-device-release/Build/Products/Release-iphoneos
          UNLOCALIZED_RESOURCES_FOLDER_PATH: TuIndiceHost.app
          TUINDICE_IOS_HOST_DEVICE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          set -euo pipefail
          bash ./.github/scripts/run-gradle-with-retry.sh \
            ./gradlew \
            -I .github/gradle/ios-host-cache.init.gradle.kts \
            --continue \
            --console=plain \
            --max-workers=2 \
            -Pcompose.ios.resources.platform=iphoneos \
            -Pcompose.ios.resources.archs=arm64 \
            ${{ needs.shared-preflight.outputs.ios_tasks }}

  preflight-production-pr:
    name: preflight-production-pr
    runs-on: ubuntu-latest
    needs:
      - shared-preflight
      - android-preflight
      - ios-preflight
    if: always()
    steps:
      - name: Verify preflight jobs
        run: |
          set -euo pipefail
          shared_result="${{ needs.shared-preflight.result }}"
          android_result="${{ needs.android-preflight.result }}"
          ios_result="${{ needs.ios-preflight.result }}"
          android_tasks="${{ needs.shared-preflight.outputs.android_tasks }}"
          ios_tasks="${{ needs.shared-preflight.outputs.ios_tasks }}"
          ios_ci_scripts_touched="${{ needs.shared-preflight.outputs.ios_ci_scripts_touched }}"
          echo "Shared preflight result: ${shared_result}"
          echo "Android preflight result: ${android_result}"
          echo "iOS preflight result: ${ios_result}"
          if [[ "${shared_result}" != "success" ]]; then
            exit 1
          fi
          if [[ -n "${android_tasks}" && "${android_result}" != "success" ]]; then
            exit 1
          fi
          if [[ ( -n "${ios_tasks}" || "${ios_ci_scripts_touched}" == "true" ) && "${ios_result}" != "success" ]]; then
            exit 1
          fi
