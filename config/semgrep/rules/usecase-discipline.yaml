rules:
  - id: usecase-single-operation
    languages: [kotlin]
    severity: ERROR
    message: >-
      Un use case expone una sola operación: execute(params) sobre su
      executeOnBackground. Funciones públicas adicionales crean lecturas que
      esquivan Loading/validator/handler/reporting; muévelas a su propio use case
      o, si es un read síncrono para un comando, inyecta el repositorio en la
      máquina (precedente AboutMachine).
    # Solo funciones públicas tab-1 sin modificador: override/private/internal y
    # miembros anidados (doble tab) quedan fuera.
    pattern-regex: '^\t(?:suspend\s+)?fun\s+\w+'
    paths:
      include:
        - '**/domain/usecase/*UseCase.kt'
        - '**/domain/usecase/**/*UseCase.kt'
      exclude:
        - '**/base/domain/usecase/base/**'
    metadata:
      area: base-components
      referencia: 'base/domain/usecase/base/FlowUseCase.kt'

  - id: paramsvalidator-location
    languages: [kotlin]
    severity: ERROR
    message: >-
      Los *ParamsValidator viven en domain/usecase/validator (README "Capas por
      feature > Domain"). Anclado al sufijo ParamsValidator: los guards EFSM de
      comandos (p. ej. SyntheticTermCommandValidator) son otra pieza y no aplican.
    pattern-regex: '\b(?:class|object)\s+\w+ParamsValidator\b'
    paths:
      exclude:
        - '**/domain/usecase/validator/**'
    metadata:
      area: base-components
      referencia: 'README.md § Capas por feature'

  - id: exceptionhandler-location
    languages: [kotlin]
    severity: ERROR
    message: >-
      Los *ExceptionHandler viven en domain/usecase/exceptionhandler (README "Capas
      por feature > Domain"): traducen throwable a error tipado del use case y el
      pipeline de FlowUseCase los invoca en execute().
    pattern-regex: '\b(?:class|object)\s+\w+ExceptionHandler\b'
    paths:
      exclude:
        - '**/domain/usecase/exceptionhandler/**'
    metadata:
      area: base-components
      referencia: 'README.md § Capas por feature'

  - id: observe-usecase-local-only
    languages: [kotlin]
    severity: ERROR
    message: >-
      Un Observe*UseCase lee solo flujos locales: no llama a repositorios que refrescan del servidor
      (refresh*, update*, fetch*, download*, sync*) ni a getters get* que leen una vez. El refresco va en un
      Update*UseCase que persiste en local, y un valor local que cambia se expone como flujo observe*Flow()
      (skill "observe use cases should read local flows only"; README "Capas por feature > Domain").
    # El receptor se identifica por el sufijo Repository de la propiedad, que es la convención de los contratos de dominio.
    pattern-regex: '\b\w*[Rr]epository\??\.(?:refresh|update|fetch|download|sync|get)\w*\s*\('
    paths:
      include:
        - '**/domain/usecase/Observe*UseCase.kt'
        - '**/domain/usecase/**/Observe*UseCase.kt'
      exclude:
        # Lectura puntual por diseño, documentada en su KDoc: el aviso pendiente se lee al llegar la señal, así que
        # cada emisión entrega el motivo vigente sin refresco remoto de por medio.
        - '**/domain/usecase/ObserveSessionInvalidationUseCase.kt'
    metadata:
      area: usecase-discipline
      referencia: '.codex/skills/implement-tuindice-module § Workflow (paso 6)'

  - id: usecase-collaborators-injected
    languages: [kotlin]
    severity: ERROR
    message: >-
      Un caso de uso no crea sus colaboradores: override val exceptionHandler = X() o
      override val paramsValidator = X() (o cualquier validador/handler que el caso de uso
      sobrescriba) construye la pieza dentro del caso de uso y la esconde de Koin y de las
      pruebas. Se recibe por constructor (o por un bundle recibido por constructor, como
      SendAssistantMessageHandling), y el caso de uso solo la reenvía.
    pattern-regex: '^[ \t]+override\s+val\s+(?:exceptionHandler|paramsValidator|\w*(?:Validator|Handler))\b[^=\n]*=\s*(?:object\s*:|(?:\w+\.)*\w+(?:<[^>\n]*>)?\s*\()'
    paths:
      include:
        - '**/domain/usecase/*UseCase.kt'
        - '**/domain/usecase/**/*UseCase.kt'
    metadata:
      area: usecase-discipline
      referencia: 'base/domain/usecase/base/FlowUseCase.kt; .codex/skills/implement-tuindice-module § Workflow (paso 6)'
