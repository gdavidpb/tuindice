rules:
  - id: no-database-outside-persistence
    languages: [kotlin]
    severity: ERROR
    message: >-
      Las features no reciben TuIndiceDatabase: consumen DAOs específicos,
      entities/projections públicas y contratos de infraestructura expuestos por
      persistence (README "Capas por feature > DI"). El registro por plataforma
      también pasa por helpers de persistence.
    pattern-regex: '\bTuIndiceDatabase\b'
    paths:
      exclude:
        - 'persistence/**'
    metadata:
      area: infrastructure
      referencia: 'README.md § DI'

  - id: eventpublisher-only-at-mvi-boundary
    languages: [kotlin]
    severity: ERROR
    message: >-
      EventPublisher se inyecta solo en la frontera MVI: los ViewModel lo entregan al
      motor con override y el wiring vive en di (README "Eventos y datos de uso").
      Máquinas, use cases y data sources no publican eventos directamente.
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.base\.domain\.repository\.EventPublisher$'
    paths:
      exclude:
        - '**/presentation/viewmodel/**'
        - '**/di/**'
        - 'base/**'
    metadata:
      area: infrastructure
      referencia: 'README.md § Eventos y datos de uso'

  - id: no-println
    languages: [kotlin]
    severity: ERROR
    message: >-
      println no es un canal de logging: base expone el contrato de logging/reporting
      del proyecto. En producción multiplataforma println no llega a ningún colector
      y se pierde (la excepción es el diagnóstico de testkit, excluido por paths).
    pattern: println(...)
    paths:
      include:
        - '**/src/commonMain/**'
      exclude:
        - 'testkit/**'
    metadata:
      area: infrastructure
      referencia: 'base (módulo): logging y ReportingRepository'

  - id: data-source-memory-is-session-memory
    languages: [kotlin]
    severity: ERROR
    message: >-
      Un data source que guarda estado en memoria (espejo de una preferencia, caché, credencial)
      sobrevive al cierre de sesión: el borrado de datos solo alcanza lo almacenado. Implementa
      SessionMemory (base/domain/session) para volver a lo que dicen los stores y enlázalo con
      bind<SessionMemory>() en su módulo de Koin (README "Memoria de sesión"). Si el estado es
      del proceso o del dispositivo y debe sobrevivir a la sesión, exclúyelo aquí con su razón.
    # Desde la cabecera de la clase hasta su primer miembro con estado, sin pasar por la palabra
    # SessionMemory (que estaría en la lista de supertipos) ni por el cierre de la clase.
    # La cabecera admite las clases privadas: un holder privado de un data source también guarda estado.
    pattern-regex: '(?s)^(?:(?:internal|private)\s+)?class\s+\w+(?:(?!\bSessionMemory\b|^\}).)*?^\t(?:@Volatile\s+)?private\s+(?:var\s+\w+|val\s+\w+\s*=\s*(?:MutableStateFlow|mutable(?:Map|List|Set)Of)\b)'
    paths:
      include:
        - '**/src/commonMain/**/data/source/**'
        - '**/src/androidMain/**/data/source/**'
        - '**/src/iosMain/**/data/source/**'
        - 'app/src/main/**/data/source/**'
        - 'persistence/src/commonMain/**/domain/mutation/**'
      exclude:
        # Estado del proceso o del dispositivo, no de la cuenta: debe sobrevivir a la sesión.
        # La actividad en primer plano, el proveedor de Play Integrity, la actualización
        # pendiente de Play y el arranque único de la recolección de uso.
        - '**/data/source/activity/CurrentActivityDataSource.kt'
        - '**/data/source/attestation/PlayIntegrityDataSource.kt'
        - '**/data/source/update/PlayUpdateDataSource.kt'
        - '**/data/source/usage/UsageDataCollectionDataSource.kt'
        # La espera que piden los servicios de la universidad vale para el dispositivo: olvidarla
        # al borrar datos (el ingreso sobre datos de otra cuenta también borra) la saltaría.
        - '**/data/source/AuthRetryWindowDataSource.kt'
        # La marca de cierre de sesión intencional la escribe el propio cierre y debe seguir ahí
        # cuando vuelvan los 401 de las peticiones que quedaron en vuelo.
        - '**/data/source/SessionInvalidationDataSource.kt'
        # Bandera transitoria: se apaga en el finally de la sincronización que el cierre cancela.
        - '**/data/source/sync/SyncDataSource.kt'
        # Dobles en memoria de variantes debug y de pruebas: no guardan datos de una cuenta real.
        - '**/data/source/**/Debug*.kt'
        - '**/data/source/**/FileKitDebug*.kt'
        - '**/data/source/usage/InMemoryUsageDataConsentRepository.kt'
        # Caché del cifrador de Tink (cachedAead): estado del dispositivo, no de la cuenta, y sin datos del estudiante.
        # Guarda el cifrador derivado de la clave maestra del Keystore del dispositivo. No sobrevive al cierre de sesión:
        # el borrado que llama el cierre de sesión (ApplicationRepository.clearData -> secureStore.clear) anula esa caché,
        # el keyset y la clave maestra, y la caché se reconstruye en el siguiente uso. SessionMemory solo repetiría ese borrado.
        - 'app/src/main/kotlin/com/gdavidpb/tuindice/data/source/secure/AndroidTinkSecureKeyValueDataSource.kt'
    metadata:
      area: infrastructure
      referencia: 'README.md § Memoria de sesión'
