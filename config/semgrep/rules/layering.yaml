rules:
  - id: domain-no-data-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      domain nunca importa clases de data (README "Capas por feature > Data").
      Define el contrato en domain/repository y deja la implementación en data/source.
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.(?:\w+\.)*data\.'
    paths:
      include:
        - '**/domain/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature'

  - id: ui-no-business-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Screen y View no acceden a repositorios, use cases ni a la capa data
      (README "Capas por feature > Presentation"). La máquina posee los use cases;
      la UI recibe estado y callbacks desde Route.
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.(?:\w+\.)*(?:data\.|domain\.usecase\.|domain\.repository\.)'
    paths:
      include:
        # La frontera composable aplica a la UI compartida; los bootstraps de
        # host en androidMain/iosMain sí tocan DI legítimamente.
        - '**/src/commonMain/**/ui/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature'

  - id: ui-no-koin-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Screen queda libre de Koin y wiring de negocio (skill "Preserve the composable boundary").
      Navigation resuelve el ViewModel con koinViewModel(...); Route puentea state/effect al Screen puro.
    pattern-regex: '^import\s+org\.koin\.'
    paths:
      include:
        # La frontera composable aplica a la UI compartida; los bootstraps de
        # host en androidMain/iosMain sí tocan DI legítimamente.
        - '**/src/commonMain/**/ui/**'
    metadata:
      area: layering
      referencia: '.codex/skills/implement-tuindice-module § composable boundary'

  - id: no-datasource-interface
    languages: [kotlin]
    severity: ERROR
    message: >-
      No deben existir interfaces *DataSource (README "Capas por feature > Data").
      Los contratos van en domain/repository (*Repository) o data/repository (*DataRepository);
      las clases concretas en data/source son las que usan el sufijo DataSource.
    pattern-regex: '\binterface\s+\w*DataSource\b'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature'

  - id: data-repository-interfaces-only
    languages: [kotlin]
    severity: ERROR
    message: >-
      data/repository no debe contener DTOs, modelos, mutaciones, resolvers ni clases concretas
      (README "Capas por feature > Data"). Solo interfaces *DataRepository; las implementaciones
      viven en data/source y los helpers en paquetes explícitos (data/model, data/mutation, ...).
    # [ \t] y no \s: con \s el inicio de línea consumiría el salto de una línea en blanco previa y el hallazgo caería una línea arriba.
    pattern-regex: '^[ \t]*(?:(?:public|internal|private|protected)\s+)?(?:(?:sealed|abstract|open|data|enum|annotation|value)\s+)*(?:class|object)\b'
    paths:
      include:
        - '**/data/repository/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature'

  # route/ y navigation/ montan pantallas: las dos primeras reglas no las cubren (su alcance son contract, machine,
  # viewmodel, transition, mapper y model); la de persistence sí, porque ninguna pantalla debe importarla.
  - id: presentation-no-compose-render-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Presentación no importa tipos de render de Compose (androidx.compose.ui.graphics o
      androidx.compose.ui.text). Solo se permiten los tipos de valor que los mappers ya precalculan (Color,
      ImageVector, AnnotatedString, SpanStyle, FontWeight, buildAnnotatedString, withStyle). Un ImageBitmap,
      un Canvas, un Path o un TextStyle son de la capa ui: pasa al estado el dato (bytes, ids, modelos) y
      deja el dibujo en ui/ (skill "Preserve the composable boundary"; README "Capas por feature > Presentation").
    pattern-regex: '^import\s+androidx\.compose\.ui\.(?:graphics\.(?!Color$|vector\.ImageVector$)|text\.(?!AnnotatedString$|SpanStyle$|buildAnnotatedString$|withStyle$|font\.FontWeight$))'
    paths:
      include:
        - '**/presentation/contract/**'
        - '**/presentation/machine/**'
        - '**/presentation/viewmodel/**'
        - '**/presentation/transition/**'
        - '**/presentation/mapper/**'
        - '**/presentation/model/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature > Presentation'

  - id: presentation-no-ui-layer-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Presentación no importa la capa ui de ninguna feature ni base.ui.view: la dependencia va de ui hacia
      presentation, no al revés. Solo se permiten ui.model y los tokens de base.ui.style. Mueve el tipo de
      presentación a presentation/model o la función de render a ui/ (README "Capas por feature > Presentation").
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.(?!base\.ui\.style\.)(?:\w+\.)*ui\.(?!model\.)'
    paths:
      include:
        - '**/presentation/contract/**'
        - '**/presentation/machine/**'
        - '**/presentation/viewmodel/**'
        - '**/presentation/transition/**'
        - '**/presentation/mapper/**'
        - '**/presentation/model/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature > Presentation'

  - id: presentation-no-persistence-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Presentación no importa com.gdavidpb.tuindice.persistence: los tipos de persistencia entran por el dominio
      de la feature (un modelo de domain/model o un resultado de domain/mapper). Expón el dato desde el
      repositorio de dominio o calcúlalo en domain/mapper (README "Capas por feature > Domain").
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.persistence\.'
    paths:
      include:
        - '**/presentation/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature > Domain'

  - id: ui-no-wire-contract-import
    languages: [kotlin]
    severity: ERROR
    message: >-
      Nada en ui/ importa com.gdavidpb.tuindice.chatcontract: el contrato de cable (JSON del
      servidor, catálogos y turnos) pertenece a data/, presentation/ y domain/. La UI recibe
      modelos de presentación (presentation/model) que el mapper ya traduce desde el contrato.
    pattern-regex: '^import\s+com\.gdavidpb\.tuindice\.chatcontract\.'
    paths:
      include:
        - '**/ui/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature > Presentation'

  - id: domain-repository-no-default-bodies
    languages: [kotlin]
    severity: ERROR
    message: >-
      Las interfaces de domain/repository no tienen funciones con cuerpo ni propiedades con getter.
      Un cuerpo por defecto en el contrato es un comportamiento silencioso que cada implementación
      hereda sin decidirlo: la función se declara abstracta y cada repositorio de data/ la implementa.
    pattern-regex: '\bfun\s+[^\n=]*\{|\bfun\s+[^\n{=]*\)\s*(?::[^\n{=]+)?=|\bget\(\)\s*[={]'
    paths:
      include:
        - '**/domain/repository/**'
    metadata:
      area: layering
      referencia: 'README.md § Capas por feature > Domain'
