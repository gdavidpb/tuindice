appId: com.gdavidpb.tuindice.debug
---
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 20000
- tapOn:
    id: base_top_app_bar_action_search_pensum
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: subjects_search_screen
    timeout: 10000
- tapOn:
    id: subjects_search_text_field
- inputText: "microondas"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: subjects_search_result_EC5333
    timeout: 15000
- tapOn:
    id: subjects_search_result_EC5333
- extendedWaitUntil:
    visible:
      id: subjects_content
    timeout: 20000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: subjects_search_screen
    timeout: 10000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 10000
