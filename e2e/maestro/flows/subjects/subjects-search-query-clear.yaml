appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: base_top_app_bar_action_search_pensum
- extendedWaitUntil:
    visible:
      id: subjects_search_screen
    timeout: 10000
- assertVisible:
    id: subjects_search_guidance
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: subjects_search_screen
- tapOn:
    id: subjects_search_text_field
- inputText: "c"
- assertVisible:
    id: subjects_search_guidance
- assertNotVisible:
    id: subjects_search_result_CI4325
- tapOn:
    id: subjects_search_clear
- assertVisible:
    id: subjects_search_guidance
- tapOn:
    id: subjects_search_text_field
- inputText: "ci"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible:
      id: subjects_search_result_CI2511
    timeout: 15000
- assertVisible:
    id: subjects_search_result_CI2511_status_approved
- assertVisible:
    id: subjects_search_result_stats_CI2511
- tapOn:
    id: subjects_search_result_stats_CI2511
- extendedWaitUntil:
    visible:
      id: subjects_content
    timeout: 30000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: subjects_search_screen
    timeout: 10000
- tapOn:
    id: subjects_search_clear
- assertVisible:
    id: subjects_search_guidance
- assertNotVisible:
    id: subjects_search_result_CI2511
- tapOn:
    id: subjects_search_text_field
- inputText: "zzzznomatch"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible: "No encontramos materias"
    timeout: 15000
- assertVisible:
    id: subjects_search_clear
- tapOn:
    id: subjects_search_clear
- assertVisible:
    id: subjects_search_guidance
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 10000
