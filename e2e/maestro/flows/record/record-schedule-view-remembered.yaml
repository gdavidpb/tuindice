appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3131313"
- tapOn:
    id: auth_password_text_field
- inputText: "annulled-provisional-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: record_term_chip_d377155d39da686f412622aaca9074cd
- tapOn:
    id: base_top_app_bar_action_record_schedule
- extendedWaitUntil:
    visible:
      id: record_schedule_table
    timeout: 10000
# A first visit opens on the table, with the switch next to the title.
- assertVisible:
    id: record_schedule_view_switch
- assertNotVisible:
    id: record_schedule_grid
- tapOn:
    id: record_schedule_view_week_tab
- extendedWaitUntil:
    visible:
      id: record_schedule_grid
    timeout: 10000
- assertNotVisible:
    id: record_schedule_table
- tapOn:
    id: record_schedule_view_table_tab
- extendedWaitUntil:
    visible:
      id: record_schedule_table
    timeout: 10000
- assertNotVisible:
    id: record_schedule_grid
- tapOn:
    id: record_schedule_view_week_tab
- extendedWaitUntil:
    visible:
      id: record_schedule_grid
    timeout: 10000
- swipe:
    from:
      id: record_schedule_title
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    notVisible:
      id: record_schedule_sheet
    timeout: 10000
# The view chosen is remembered: the sheet opens again on the week.
- tapOn:
    id: base_top_app_bar_action_record_schedule
- extendedWaitUntil:
    visible:
      id: record_schedule_grid
    timeout: 10000
- assertNotVisible:
    id: record_schedule_table
- swipe:
    from:
      id: record_schedule_title
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    notVisible:
      id: record_schedule_sheet
    timeout: 10000
# Signing out forgets it, in the same process: the next session starts on the table again.
- runFlow: ../auth/sign-out.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3131313"
- tapOn:
    id: auth_password_text_field
- inputText: "annulled-provisional-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: record_term_chip_d377155d39da686f412622aaca9074cd
- tapOn:
    id: base_top_app_bar_action_record_schedule
- extendedWaitUntil:
    visible:
      id: record_schedule_table
    timeout: 10000
- assertNotVisible:
    id: record_schedule_grid
