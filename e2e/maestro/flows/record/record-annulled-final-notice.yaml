appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3232323"
- tapOn:
    id: auth_password_text_field
- inputText: "annulled-final-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- extendedWaitUntil:
    visible:
      id: base_notice_view
    timeout: 10000
- assertVisible: "Tu inscripción fue anulada"
- assertVisible:
    id: record_term_selector_row
- assertNotVisible:
    id: record_term_view_switch
