appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: record_create_synthetic_term_fab
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_screen
    timeout: 10000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: record_create_synthetic_term_search_tab
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_field
    timeout: 10000
- tapOn:
    id: record_create_synthetic_term_search_field
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "zz"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "zz"
      - pasteText
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow: ../_shared/submit-ios-search-key-if-visible.yaml
- assertVisible:
    id: record_create_synthetic_term_search_field
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_results_title
    timeout: 15000
- assertVisible:
    text: "No encontramos materias"
- assertNotVisible:
    id: record_create_synthetic_term_subject_EC5201
- runFlow:
    when:
      visible: "Sugeridas por tu pensum"
    commands:
      - assertVisible:
          text: "Sugeridas por tu pensum"
      - assertVisible:
          id: record_create_synthetic_term_subject_MA1112
