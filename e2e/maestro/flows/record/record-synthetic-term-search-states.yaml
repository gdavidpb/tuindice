appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- tapOn:
    id: record_create_synthetic_term_fab
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_screen
    timeout: 10000
- tapOn:
    id: record_create_synthetic_term_search_tab
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_field
    timeout: 10000
- tapOn:
    id: record_create_synthetic_term_search_field
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "prioridad"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "prioridad"
      - pasteText
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_result_0_subject_EP1420
    timeout: 20000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_result_1_subject_EP1308
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_result_2_subject_EP2308
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_result_3_subject_AA1001
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_search_result_3_subject_AA1001
- assertVisible:
    id: record_create_synthetic_term_subject_AA1001_status_not_in_pensum
- assertVisible:
    id: record_create_synthetic_term_subject_AA1001_stats_button
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EP1420_status_available
    direction: UP
    timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_subject_EP1420_stats_button
- tapOn:
    id: record_create_synthetic_term_subject_EP1420_stats_button
- extendedWaitUntil:
    visible:
      id: subjects_content
    timeout: 30000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_field
    timeout: 10000
- assertVisible:
    id: record_create_synthetic_term_search_result_0_subject_EP1420
- assertVisible:
    id: record_create_synthetic_term_subject_EP1420_stats_button
- assertVisible:
    id: record_create_synthetic_term_subject_EP1420_add_button
- tapOn:
    id: record_create_synthetic_term_subject_EP1420_add_button
- assertNotVisible:
    id: record_create_synthetic_term_subject_EP1420_add_button
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EP1420_remove_button
    direction: UP
    timeout: 10000
- assertVisible:
    id: record_create_synthetic_term_subject_EP1420_remove_button
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EP1308_status_already_planned
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_subject_EP1308_stats_button
- assertNotVisible:
    id: record_create_synthetic_term_subject_EP1308_add_button
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EP2308_status_unavailable
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_subject_EP2308_stats_button
- assertNotVisible:
    id: record_create_synthetic_term_subject_EP2308_add_button
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_clear_button
    direction: UP
    timeout: 20000
- tapOn:
    id: record_create_synthetic_term_search_clear_button
- tapOn:
    id: record_create_synthetic_term_search_field
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "ma"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "ma"
      - pasteText
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_taken_subjects_toggle
    timeout: 20000
- tapOn:
    id: record_create_synthetic_term_taken_subjects_toggle
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_MA1111_status_already_taken
    direction: UP
    timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_subject_MA1111_stats_button
- assertNotVisible:
    id: record_create_synthetic_term_subject_MA1111_add_button
