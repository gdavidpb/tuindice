appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- tapOn:
    id: record_create_synthetic_term_fab
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_screen
    timeout: 10000
- assertVisible:
    id: record_create_synthetic_term_period_selector
- assertVisible:
    id: record_create_synthetic_term_submit_button
    enabled: false
- tapOn:
    id: record_create_synthetic_term_search_tab
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_search_field
    timeout: 10000
- tapOn:
    id: record_create_synthetic_term_search_field
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "ec"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "ec"
      - pasteText
- tapOn:
    id: record_create_synthetic_term_search_clear_button
- assertVisible:
    id: record_create_synthetic_term_search_field
- tapOn:
    id: record_create_synthetic_term_search_field
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "ec"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "ec"
      - pasteText
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "87%,89%"
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EC5201_add_button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: record_create_synthetic_term_subject_EC5201_add_button
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_subject_EC5201_remove_button
    timeout: 10000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_EC5333_add_button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: record_create_synthetic_term_subject_EC5333_add_button
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_subject_EC5333_remove_button
    timeout: 10000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_field
    direction: UP
    timeout: 20000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: record_create_synthetic_term_search_field
      - eraseText: 20
      - runFlow:
          when:
            platform: Android
          commands:
            - inputText: "ma"
      - runFlow:
          when:
            platform: iOS
          commands:
            - setClipboard: "ma"
            - pasteText
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: "87%,89%"
      - scrollUntilVisible:
          element:
            id: record_create_synthetic_term_subject_MA1112_add_button
          direction: DOWN
          timeout: 20000
- assertVisible:
    id: record_create_synthetic_term_submit_button
    enabled: true
- tapOn:
    id: record_create_synthetic_term_submit_button
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: record_attempt_item_2026-SEP_DEC-EC5201-1
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: record_attempt_item_2026-SEP_DEC-EC5333-2
    timeout: 15000
- tapOn:
    id: record_edit_synthetic_term_button
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_screen
    timeout: 10000
- assertVisible:
    id: record_create_synthetic_term_subject_EC5201_remove_button
- assertVisible:
    id: record_create_synthetic_term_subject_EC5333_remove_button
- tapOn:
    id: record_create_synthetic_term_search_tab
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_search_field
    direction: DOWN
    visibilityPercentage: 50
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: record_create_synthetic_term_search_field
      - eraseText: 20
      - runFlow:
          when:
            platform: Android
          commands:
            - inputText: "ma"
      - runFlow:
          when:
            platform: iOS
          commands:
            - setClipboard: "ma"
            - pasteText
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: "87%,89%"
      - extendedWaitUntil:
          visible:
            id: record_create_synthetic_term_search_results_title
          timeout: 20000
- scrollUntilVisible:
    element:
      id: record_create_synthetic_term_subject_MA1121_add_button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: record_create_synthetic_term_subject_MA1121_add_button
- extendedWaitUntil:
    visible:
      id: record_create_synthetic_term_subject_MA1121_remove_button
    timeout: 10000
- tapOn:
    id: record_create_synthetic_term_submit_button
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: record_attempt_item_2026-SEP_DEC-MA1121-3
    timeout: 15000
- tapOn:
    id: record_term_chip_2026-SEP_DEC
- extendedWaitUntil:
    visible:
      id: record_delete_synthetic_term_button
    timeout: 10000
- tapOn:
    id: record_delete_synthetic_term_button
- extendedWaitUntil:
    visible:
      id: base_confirmation_dialog_sheet
    timeout: 10000
- assertVisible:
    id: record_delete_synthetic_term_message
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    visible:
      id: base_snackbar_container
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: record_attempt_item_2026-SEP_DEC-EC5201-1
    timeout: 15000
