appId: com.gdavidpb.tuindice.debug
---
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- assertVisible:
    id: record_term_selector_row
- assertVisible:
    id: record_attempts_list
- tapOn:
    id: record_top_bar_view_mode_switch
- assertVisible:
    id: record_top_bar_view_mode_banner
- tapOn:
    id: record_top_bar_view_mode_switch
- tapOn:
    id: record_term_current_chip_.*
- extendedWaitUntil:
    visible:
      id: base_top_app_bar_action_enrollment_proof
    timeout: 10000
