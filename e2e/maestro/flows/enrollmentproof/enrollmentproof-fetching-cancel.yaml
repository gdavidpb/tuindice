appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 30000
- tapOn:
    id: record_term_current_chip_.*
- extendedWaitUntil:
    visible:
      id: base_top_app_bar_action_enrollment_proof
    timeout: 10000
- tapOn:
    id: base_top_app_bar_action_enrollment_proof
- extendedWaitUntil:
    visible:
      id: enrollment_fetching_sheet
    timeout: 10000
- assertVisible:
    id: enrollment_fetching_loading_container
- assertVisible:
    id: enrollment_fetching_message
- tapOn:
    id: enrollment_fetching_cancel_button
- extendedWaitUntil:
    visible:
      id: record_content_container
    timeout: 10000
