appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3333344"
- tapOn:
    id: auth_password_text_field
- inputText: "new-student-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
# Signing in always leaves a profile (name and career), so Summary shows its content. What the
# university does not have yet is the record, and Record and Evaluations are the ones that say so.
- assertVisible:
    id: summary_content_container
- tapOn:
    id: maincore_tuindice_bottom_bar_record_item
- extendedWaitUntil:
    visible:
      id: base_error_view_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible: "Aún no tienes expediente en la universidad"
- assertVisible:
    id: base_error_view_retry_button
- tapOn:
    id: maincore_tuindice_bottom_bar_evaluations_item
- extendedWaitUntil:
    visible:
      id: base_error_view_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible: "Aún no tienes expediente en la universidad"
# Back on Summary, once the sync has answered (Record and Evaluations just read it): a missing
# record is not a sync problem, so the sync row asks for nothing and its icon opens no details.
- tapOn:
    id: maincore_tuindice_bottom_bar_summary_item
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 10000
- assertVisible:
    id: summary_status_icon_button
    enabled: false
- tapOn:
    id: summary_status_icon_button
- assertNotVisible:
    id: summary_sync_status_message
- assertVisible:
    id: summary_content_container
