appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "8888888"
- inputText: "8"
- tapOn:
    id: auth_password_text_field
- inputText: "summary-unavailable-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- extendedWaitUntil:
    visible:
      id: wizard_welcome_screen
    timeout: 30000
- tapOn:
    id: wizard_skip_button
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: summary_status_icon_button
- extendedWaitUntil:
    visible:
      id: summary_sync_status_message
    timeout: 10000
- assertVisible:
    id: base_confirmation_dialog_positive_button
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    notVisible:
      id: summary_sync_status_message
    timeout: 10000
- assertVisible:
    id: summary_content_container
