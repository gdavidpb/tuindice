appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3030303"
- tapOn:
    id: auth_password_text_field
- inputText: "not-enrolled-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- extendedWaitUntil:
    visible:
      id: summary_status_icon_button
    timeout: 10000
- tapOn:
    id: summary_status_icon_button
- extendedWaitUntil:
    visible:
      id: summary_sync_status_message
    timeout: 10000
- assertVisible: "No estás inscrito en este trimestre"
- assertVisible: "La universidad no reporta una inscripción vigente para ti en este trimestre. Tus notas anteriores siguen disponibles."
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    notVisible:
      id: summary_sync_status_message
    timeout: 10000
- assertVisible:
    id: summary_content_container
