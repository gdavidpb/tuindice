appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "2222222"
- tapOn:
    id: auth_password_text_field
- inputText: "enrollment-unavailable-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- extendedWaitUntil:
    visible:
      id: summary_status_icon_halo
    timeout: 10000
- tapOn:
    id: summary_status_icon_button
- extendedWaitUntil:
    visible:
      id: summary_sync_status_message
    timeout: 10000
- assertVisible: "No pudimos actualizar tu inscripción porque el servicio de la universidad no está disponible. Tus datos anteriores se mantienen y volveremos a intentar más tarde."
- assertVisible:
    id: base_confirmation_dialog_positive_button
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    notVisible:
      id: summary_status_icon_halo
    timeout: 10000
- assertVisible:
    id: summary_content_container
