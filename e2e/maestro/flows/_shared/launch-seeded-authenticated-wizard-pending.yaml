appId: com.gdavidpb.tuindice.debug
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      TUINDICE_E2E_SEED_STATE: "authenticatedWizardPending"
      TUINDICE_E2E_MAIN_SECTION: "SUMMARY"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          clearState: false
          arguments:
            TUINDICE_E2E_SEED_STATE: "authenticatedWizardPending"
            TUINDICE_E2E_MAIN_SECTION: "SUMMARY"
- extendedWaitUntil:
    visible:
      id: wizard_welcome_screen
    timeout: 30000
