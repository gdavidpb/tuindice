appId: com.gdavidpb.tuindice.debug
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      TUINDICE_E2E_NETWORK_AVAILABLE: "true"
      TUINDICE_E2E_WIZARD_PENDING: "true"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          clearState: false
          arguments:
            TUINDICE_E2E_NETWORK_AVAILABLE: "true"
            TUINDICE_E2E_WIZARD_PENDING: "true"
- extendedWaitUntil:
    visible:
      id: auth_usb_id_text_field
    timeout: 20000
- runFlow: ../auth/login-success.yaml
