appId: com.gdavidpb.tuindice.debug
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      TUINDICE_E2E_NETWORK_AVAILABLE: "true"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          clearState: false
          arguments:
            TUINDICE_E2E_NETWORK_AVAILABLE: "true"
- extendedWaitUntil:
    visible:
      id: auth_usb_id_text_field
    timeout: 20000
