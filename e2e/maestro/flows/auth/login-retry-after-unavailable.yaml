appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3333333"
- inputText: "3"
- tapOn:
    id: auth_password_text_field
- inputText: "retry-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
# The university's services answered 503 with Retry-After: sign-in waits instead of offering an
# immediate retry, and comes back when the wait is over.
- extendedWaitUntil:
    visible:
      id: auth_service_unavailable_message
    timeout: 20000
- assertVisible: "Servicios de la universidad no disponibles. Vuelve a intentarlo en unos segundos."
- assertVisible:
    id: auth_sign_in_button
    enabled: false
- assertNotVisible:
    id: base_snackbar_action_button
- extendedWaitUntil:
    notVisible:
      id: auth_service_unavailable_message
    timeout: 30000
- assertVisible:
    id: auth_sign_in_button
    enabled: true
- tapOn:
    id: auth_sign_in_button
- extendedWaitUntil:
    visible:
      id: auth_service_unavailable_message
    timeout: 20000
- assertVisible:
    id: auth_sign_in_idle_container
