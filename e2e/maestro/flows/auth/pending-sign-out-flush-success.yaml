- extendedWaitUntil:
    visible:
      id: evaluations_content_container
    timeout: 20000
- tapOn:
    id: evaluations_add_fab
- extendedWaitUntil:
    visible:
      id: evaluation_content_container
    timeout: 20000
- tapOn:
    id: evaluation_subject_chip_e21f0d7e481d13d19f328d6818ce4d77
- tapOn:
    id: evaluation_type_chip_test
- tapOn:
    id: evaluation_date_select_button
- extendedWaitUntil:
    visible:
      id: evaluation_calendar_container
    timeout: 10000
- tapOn:
    id: evaluation_calendar_day_cell_15
- tapOn:
    id: evaluation_date_dialog_accept_button
- tapOn:
    id: evaluation_max_grade_chip
- extendedWaitUntil:
    visible:
      id: evaluation_dialog_title
    timeout: 10000
- tapOn:
    id: evaluation_dialog_confirm_button
