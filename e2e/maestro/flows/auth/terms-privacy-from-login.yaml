      id: maincore_browser_container
    timeout: 10000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: auth_sign_in_idle_container
    timeout: 10000
- tapOn:
    id: auth_privacy_policy_link
- extendedWaitUntil:
    visible:
      id: maincore_browser_container
    timeout: 10000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: auth_sign_in_idle_container
    timeout: 10000
