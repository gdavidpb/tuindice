appId: com.gdavidpb.tuindice.debug
---
- tapOn:
    id: maincore_tuindice_bottom_bar_about_item
- extendedWaitUntil:
    visible:
      id: about_content_container
    timeout: 20000
- tapOn:
    id: about_open_privacy
- extendedWaitUntil:
    visible:
      id: maincore_browser_container
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Abrir enlace externo"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,28%"
- extendedWaitUntil:
    visible:
      id: base_external_resource_message
    timeout: 10000
- assertVisible:
    id: base_external_resource_url
- tapOn:
    id: base_confirmation_dialog_negative_button
- extendedWaitUntil:
    visible:
      id: maincore_browser_container
    timeout: 10000
- tapOn:
    id: maincore_tuindice_top_bar_back_button
- extendedWaitUntil:
    visible:
      id: about_content_container
    timeout: 10000
- tapOn:
    id: maincore_tuindice_bottom_bar_summary_item
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 20000
