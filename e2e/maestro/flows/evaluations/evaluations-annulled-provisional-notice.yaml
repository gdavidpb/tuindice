appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "3131313"
- tapOn:
    id: auth_password_text_field
- inputText: "annulled-provisional-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_evaluations_item
- extendedWaitUntil:
    visible:
      id: evaluations_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
# During the corrections window the term is still there: the evaluations stay usable and look as
# they would without the annulment. The record is the one that explains it, not this screen.
- assertVisible:
    id: evaluations_content_container
- assertVisible:
    id: evaluations_week_strip
- assertNotVisible:
    id: base_notice_view
- assertNotVisible: "Tu inscripción aparece anulada"
