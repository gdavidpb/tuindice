appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "1010101"
- tapOn:
    id: auth_password_text_field
- inputText: "evaluations-enrollment-unavailable-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_evaluations_item
- extendedWaitUntil:
    visible:
      id: base_empty_view_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible:
    id: base_empty_state_animation
- assertVisible: "Servicio de inscripción no disponible"
- assertVisible: "El servicio de inscripción de la universidad no responde. Cuando se restablezca, tus evaluaciones aparecerán aquí."
- assertNotVisible:
    id: base_empty_view_action_button
