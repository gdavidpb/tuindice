appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_evaluations_item
- extendedWaitUntil:
    visible:
      id: evaluations_content_container
    timeout: 30000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- scrollUntilVisible:
    element:
      id: evaluation_item_card_741ee22ed3a76b1bbd7deb77e9490435
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 15000
- assertVisible:
    id: evaluation_item_card_741ee22ed3a76b1bbd7deb77e9490435
- tapOn:
    id: evaluation_item_card_741ee22ed3a76b1bbd7deb77e9490435
- extendedWaitUntil:
    visible:
      id: evaluation_swipe_edit_action
    timeout: 10000
- assertVisible:
    id: evaluation_swipe_to_dismiss_container
- tapOn:
    id: evaluation_swipe_edit_action
- extendedWaitUntil:
    visible:
      id: evaluation_content_container
    timeout: 20000
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible:
    id: evaluation_subject_chip_722cc2cc935e0aefdc73f9ebf9d2f1b6
- assertVisible:
    id: evaluation_subject_picker_row
- assertVisible:
    id: evaluation_type_picker_row
- assertVisible:
    id: evaluation_date_picker
- assertVisible:
    id: evaluation_max_grade_chip
- assertVisible:
    id: evaluation_done_fab
    enabled: false
- tapOn:
    id: evaluation_type_chip_written_work
- tapOn:
    id: evaluation_type_chip_test
- assertVisible:
    id: evaluation_done_fab
    enabled: true
- tapOn:
    id: evaluation_done_fab
- extendedWaitUntil:
    visible:
      id: evaluations_content_container
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: base_snackbar_container
    timeout: 15000
