appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- assertVisible:
    id: pensum_canvas
- assertVisible:
    id: pensum_canvas_legend
- tapOn:
    id: pensum_status_filter_available
- assertVisible:
    id: pensum_status_filter_clear
- tapOn:
    id: pensum_status_filter_current
- tapOn:
    id: pensum_status_filter_clear
- assertNotVisible:
    id: pensum_status_filter_clear
- assertVisible:
    id: pensum_focus_progress
- doubleTapOn:
    id: pensum_canvas
- assertVisible:
    id: pensum_sticky_terms
- doubleTapOn:
    id: pensum_canvas
- tapOn:
    id: pensum_zoom_in
- extendedWaitUntil:
    visible:
      id: pensum_fit_to_screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: pensum_minimap_toggle
    timeout: 10000
- tapOn:
    id: pensum_minimap_toggle
- assertVisible:
    id: pensum_minimap
- tapOn:
    id: pensum_minimap
- tapOn:
    id: pensum_focus_progress
- tapOn:
    id: pensum_zoom_out
- tapOn:
    id: pensum_fit_to_screen
- extendedWaitUntil:
    notVisible:
      id: pensum_fit_to_screen
    timeout: 10000
- assertNotVisible:
    id: pensum_minimap_toggle
- assertNotVisible:
    id: pensum_minimap
- assertNotVisible:
    id: pensum_sticky_terms
