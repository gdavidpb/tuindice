appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../wizard/wizard-smoke.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- assertVisible:
    id: pensum_canvas
- tapOn:
    id: pensum_zoom_in
- tapOn:
    id: pensum_zoom_out
