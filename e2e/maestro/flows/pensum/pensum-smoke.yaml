appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- assertVisible:
    id: pensum_summary_container
- tapOn:
    id: pensum_summary_container
- assertNotVisible:
    id: pensum_context_summary
- tapOn:
    id: pensum_summary_container
- assertVisible:
    id: pensum_context_summary
- assertVisible:
    id: pensum_canvas
- assertVisible:
    id: pensum_canvas_legend
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: pensum_status_filter_available
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible:
    id: pensum_status_filter_clear
- tapOn:
    id: pensum_status_filter_current
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- tapOn:
    id: pensum_status_filter_clear
- assertNotVisible:
    id: pensum_status_filter_clear
- assertVisible:
    id: pensum_focus_progress
- doubleTapOn:
    id: pensum_canvas
- assertVisible:
    id: pensum_sticky_terms
- swipe:
    direction: LEFT
    duration: 600
- assertVisible:
    id: pensum_sticky_terms
- doubleTapOn:
    id: pensum_canvas
- tapOn:
    id: pensum_zoom_in
- extendedWaitUntil:
    visible:
      id: pensum_fit_to_screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: pensum_minimap_toggle
    timeout: 10000
- tapOn:
    id: pensum_minimap_toggle
- assertVisible:
    id: pensum_minimap
    timeout: 10000
- tapOn:
    id: pensum_status_filter_available
- runFlow: ../_shared/dismiss-coachmarks-if-visible.yaml
- assertVisible:
    id: pensum_status_filter_clear
- tapOn:
    id: maincore_tuindice_bottom_bar_summary_item
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 20000
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 20000
- assertVisible:
    id: pensum_status_filter_clear
- assertVisible:
    id: pensum_sticky_terms
- assertVisible:
    id: pensum_minimap
    timeout: 10000
- tapOn:
    id: pensum_minimap
- tapOn:
    id: pensum_focus_progress
- tapOn:
    id: pensum_zoom_out
- tapOn:
    id: pensum_fit_to_screen
- extendedWaitUntil:
    notVisible:
      id: pensum_fit_to_screen
    timeout: 10000
- assertNotVisible:
    id: pensum_minimap_toggle
- assertNotVisible:
    id: pensum_minimap
- assertNotVisible:
    id: pensum_sticky_terms
