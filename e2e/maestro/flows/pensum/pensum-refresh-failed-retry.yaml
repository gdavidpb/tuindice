appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "7777777"
- inputText: "7"
- tapOn:
    id: auth_password_text_field
- inputText: "pensum-retry-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: auth_sign_in_button
- extendedWaitUntil:
    visible:
      id: wizard_welcome_screen
    timeout: 30000
- tapOn:
    id: wizard_skip_button
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 30000
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: base_error_view_container
    timeout: 30000
- tapOn:
    id: base_error_view_retry_button
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- assertVisible:
    id: pensum_canvas
