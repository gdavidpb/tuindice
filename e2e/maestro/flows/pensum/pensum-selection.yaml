appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- runFlow: ../_shared/continue-to-summary-after-auth.yaml
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: pensum_context_summary
- extendedWaitUntil:
    visible:
      id: base_confirmation_dialog_sheet
    timeout: 10000
- scrollUntilVisible:
    element:
      id: pensum_version_option_2018
    direction: LEFT
    timeout: 10000
- tapOn:
    id: pensum_version_option_2018
- tapOn:
    id: pensum_modality_option_long_internship
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    visible:
      id: pensum_node_0800-2018-long_internship-t1-math1-ma1111
    timeout: 30000
- assertVisible:
    id: pensum_canvas
