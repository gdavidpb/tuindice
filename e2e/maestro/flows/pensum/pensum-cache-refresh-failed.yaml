appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn:
    id: auth_usb_id_text_field
- inputText: "9999999"
- inputText: "9"
- tapOn:
    id: auth_password_text_field
- inputText: "pensum-cache-pass"
- tapOn:
    id: auth_keyboard_dismiss_area
- tapOn:
    id: auth_sign_in_button
- extendedWaitUntil:
    visible:
      id: wizard_welcome_screen
    timeout: 30000
- tapOn:
    id: wizard_skip_button
- extendedWaitUntil:
    visible:
      id: summary_content_container
    timeout: 30000
- tapOn:
    id: maincore_tuindice_bottom_bar_pensum_item
- extendedWaitUntil:
    visible:
      id: pensum_screen
    timeout: 30000
- assertVisible:
    id: pensum_canvas
- tapOn:
    id: pensum_context_summary
- extendedWaitUntil:
    visible:
      id: base_confirmation_dialog_sheet
    timeout: 10000
- scrollUntilVisible:
    element:
      id: pensum_version_option_2018
    direction: LEFT
    timeout: 10000
- tapOn:
    id: pensum_version_option_2018
- tapOn:
    id: pensum_modality_option_long_internship
- tapOn:
    id: base_confirmation_dialog_positive_button
- extendedWaitUntil:
    visible:
      id: pensum_canvas
    timeout: 30000
- runFlow:
    when:
      visible:
        id: pensum_local_data_warning
    commands:
      - assertVisible:
          id: pensum_local_data_warning
- runFlow:
    when:
      notVisible:
        id: pensum_local_data_warning
    commands:
      - assertNotVisible:
          id: pensum_local_data_warning
- assertVisible:
    id: pensum_canvas
- assertVisible:
    id: pensum_node_0800-2018-long_internship-t1-math1-ma1111
- assertNotVisible:
    id: base_snackbar_container
