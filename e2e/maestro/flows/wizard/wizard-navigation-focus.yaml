appId: com.gdavidpb.tuindice.debug
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../auth/login-success.yaml
- assertVisible:
    id: wizard_welcome_screen
- tapOn:
    id: wizard_primary_button
- extendedWaitUntil:
    visible:
      id: wizard_current_step_summary
    timeout: 10000
- assertVisible:
    id: wizard_screen
- assertVisible:
    id: wizard_guide_bar
- assertVisible:
    id: wizard_progress_text
- tapOn:
    id: wizard_primary_button
- extendedWaitUntil:
    visible:
      id: wizard_current_step_record
    timeout: 10000
- assertVisible:
    id: wizard_focus_overlay
- assertVisible:
    id: wizard_focus_label
- tapOn:
    id: wizard_primary_button
- extendedWaitUntil:
    visible:
      id: wizard_current_step_record_actions
    timeout: 10000
- assertVisible:
    id: wizard_focus_overlay
- assertVisible:
    id: wizard_focus_label
- tapOn:
    id: wizard_back_button
- extendedWaitUntil:
    visible:
      id: wizard_current_step_record
    timeout: 10000
- tapOn:
    id: wizard_back_button
- extendedWaitUntil:
    visible:
      id: wizard_current_step_summary
    timeout: 10000
