[versions]
kotlin = "2.3.10"
ksp = "2.3.2"
room = "2.8.4"
sqlite = "2.6.2"
koin = "4.1.1"
lifecycle = "2.10.0"
lifecycle-ext = "2.2.0"
coroutines = "1.10.2"
turbine = "1.2.1"
firebase-bom = "34.9.0"
coil = "2.7.0"
compose-bom = "2026.02.00"
lottie-compose = "6.7.1"
compottie = "2.0.1"
androidx-core = "2.2.0"
kotlinx-datetime = "0.7.1"
kotlinx-serialization-json = "1.10.0"
browser = "1.9.0"
preference-ktx = "1.2.1"
espresso-core = "3.7.0"
exifinterface = "1.4.2"
wiremock = "3.13.2"
junit = "4.13.2"
app-update-ktx = "2.1.0"
review-ktx = "2.0.2"
integrity = "1.6.0"
test-runner = "1.7.0"
test-ext-junit = "1.3.0"
activity-compose = "1.12.4"
icons-compose = "1.7.8"
constraintlayout-compose = "1.1.1"
google-services = "4.4.4"
android-gradle-plugin = "8.12.0"
firebase-crashlytics-gradle = "3.0.6"
core-ktx = "1.17.0"
material = "1.13.0"
ktor = "3.4.0"
material3 = "1.4.0"
navigation = "2.9.1"
compose = "1.10.3"
compose-mpp = "1.9.3"
compose-mpp-material3 = "1.9.0"
datastore = "1.1.7"

[libraries]
# Room
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }

# Android / AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-crashlytics-gradle = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebase-crashlytics-gradle" }

# Google
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "app-update-ktx" }
review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "review-ktx" }
integrity = { module = "com.google.android.play:integrity", version.ref = "integrity" }
google-services = { module = "com.google.gms:google-services", version.ref = "google-services" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons-compose" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayout-compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-mpp" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-mpp" }
jetbrains-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-mpp" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-mpp-material3" }

# Navigation
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# Architecture
core-runtime = { module = "androidx.arch.core:core-runtime", version.ref = "androidx-core" }
core-common = { module = "androidx.arch.core:core-common", version.ref = "androidx-core" }

# Lifecycle
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle-ext" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Lottie
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie-compose" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }

# Coil
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mpp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
coil = ["coil", "coil-compose"]
room = ["room-ktx", "room-runtime"]
testing = ["junit", "wiremock"]
testing-android = ["koin-test", "test-runner", "espresso-core"]
androidx = ["core-ktx", "browser", "preference-ktx", "exifinterface", "datastore-preferences"]
kotlin = ["kotlin-reflect", "kotlinx-datetime", "kotlinx-serialization-json"]
koin = ["koin-android", "koin-compose", "koin-compose-viewmodel"]
firebase = ["firebase-config", "firebase-messaging", "firebase-crashlytics"]
google = ["app-update-ktx", "material", "review-ktx", "integrity"]
compose = ["compose-ui", "compose-foundation", "compose-animation", "compose-ui-tooling", "compose-preview", "compose-activity", "compose-material3", "compose-icons", "compose-constraintlayout"]
compose-mpp-core = ["jetbrains-compose-ui", "jetbrains-compose-foundation", "jetbrains-compose-animation", "jetbrains-compose-material3"]
navigation = ["navigation-compose"]
architecture = ["core-runtime", "core-common"]
lifecycle = ["lifecycle-runtime-compose", "lifecycle-viewmodel-compose", "lifecycle-extensions", "lifecycle-runtime-ktx", "lifecycle-viewmodel-ktx"]
coroutines = ["kotlinx-coroutines-android", "kotlinx-coroutines-play-services"]
testing-kmp = ["kotlinx-coroutines-test", "turbine"]
ktor = ["ktor-client-core", "ktor-client-auth", "ktor-client-logging", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
