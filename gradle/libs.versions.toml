[versions]
kotlin = "2.1.10"
ksp = "2.0.20-1.0.25"
room = "2.6.1"
koin = "4.0.1"
lifecycle = "2.8.7"
lifecycle-ext = "2.2.0"
coroutines = "1.9.0"
firebase-bom = "33.9.0"
coil = "2.7.0"
compose-bom = "2025.02.00"
store = "5.1.0-alpha05"
lottie-compose = "6.5.2"
androidx-core = "2.2.0"
kotlinx-datetime = "0.6.1"
kotlinx-serialization-json = "1.7.3"
browser = "1.8.0"
preference-ktx = "1.2.1"
espresso-core = "3.6.1"
exifinterface = "1.3.7"
wiremock = "3.9.1"
junit = "4.13.2"
app-update-ktx = "2.1.0"
review-ktx = "2.0.2"
integrity = "1.4.0"
test-runner = "1.6.2"
activity-compose = "1.10.0"
constraintlayout-compose = "1.1.0"
google-services = "4.4.2"
android-gradle-plugin = "8.9.0-rc02"
firebase-crashlytics-gradle = "3.0.3"
core-ktx = "1.15.0"
material = "1.12.0"
ktor = "3.0.3"
security-crypto-ktx = "1.1.0-alpha06"
material3 = "1.3.1"
navigation = "2.8.7"
compose = "1.7.8"

[libraries]
# Room
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }

# Android / AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
security-crypto-ktx = { module = "androidx.security:security-crypto-ktx", version.ref = "security-crypto-ktx" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# Google
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "app-update-ktx" }
review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "review-ktx" }
integrity = { module = "com.google.android.play:integrity", version.ref = "integrity" }
google-services = { module = "com.google.gms:google-services", version.ref = "google-services" }
firebase-crashlytics-gradle = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebase-crashlytics-gradle" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayout-compose" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Architecture
core-runtime = { module = "androidx.arch.core:core-runtime", version.ref = "androidx-core" }
core-common = { module = "androidx.arch.core:core-common", version.ref = "androidx-core" }

# Lifecycle
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle-ext" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Lottie
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie-compose" }

# Coil
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Store
store = { module = "org.mobilenativefoundation.store:store5", version.ref = "store" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
coil = ["coil", "coil-compose"]
room = ["room-ktx", "room-runtime"]
testing = ["junit", "wiremock"]
testing-android = ["koin-test", "test-runner", "espresso-core"]
androidx = ["core-ktx", "browser", "preference-ktx", "exifinterface", "security-crypto-ktx"]
kotlin = ["kotlin-reflect", "kotlinx-datetime", "kotlinx-serialization-json"]
koin = ["koin-android", "koin-androidx-compose"]
firebase = ["firebase-config", "firebase-auth", "firebase-messaging", "firebase-crashlytics"]
google = ["app-update-ktx", "material", "review-ktx", "integrity"]
compose = ["compose-ui", "compose-foundation", "compose-animation", "compose-ui-tooling", "compose-preview", "compose-activity", "compose-material3", "compose-icons", "compose-constraintlayout"]
navigation = ["navigation-compose"]
architecture = ["core-runtime", "core-common"]
lifecycle = ["lifecycle-runtime-compose", "lifecycle-viewmodel-compose", "lifecycle-extensions", "lifecycle-runtime-ktx", "lifecycle-viewmodel-ktx"]
coroutines = ["kotlinx-coroutines-android", "kotlinx-coroutines-play-services"]
ktor = ["ktor-client-core", "ktor-client-cio", "ktor-client-auth", "ktor-client-logging", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]