interface:
  display_name: "Implement TuIndice Module"
  short_description: "Crea o modifica módulos KMP con E2E local requerido"
  default_prompt: "Use $implement-tuindice-module to create or modify Kotlin Multiplatform modules and app frontend flows in this tuindice repository, including required local E2E tests and supporting artifacts whenever the change affects user-visible behavior, navigation, selectors, fixtures, app startup/reset, or platform edges. Cover new features, shared modules, architecture, Gradle setup, Koin wiring, navigation, platform bindings, root verification tasks, smoke tests, and E2E coverage with Maestro/XCUITest/Compose/Espresso/UI Automator for modules such as base, persistence, maincore, app, auth, about, summary, record, evaluations, enrollmentproof, subjects, pensum, wizard, and testkit."
