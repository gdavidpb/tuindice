    fixture_state: pensum-unavailable-then-success
  - id: pensum.Pensum.SelectPensum
    classification: internal
    reason: current bottom sheet keeps version as local UI state and dispatches SelectSelection on apply
  - id: pensum.Pensum.SelectModality
    classification: internal
    reason: current bottom sheet keeps modality as local UI state and dispatches SelectSelection on apply
  - id: pensum.Pensum.SelectSelection
    classification: user
