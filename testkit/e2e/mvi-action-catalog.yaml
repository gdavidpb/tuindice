version: 1
source: commonMain presentation contracts
policy:
  required_scope: visible_user_actions
  internal_actions: lifecycle, observation, state bootstrap, route loading, renderer callbacks
  coverage_rule: user and platform-edge actions must declare a flow or platform_edge
actions:
  - id: about.About.LoadVersion
    classification: internal
    reason: screen bootstrap
  - id: about.About.OpenTermsAndConditions
    classification: user
    variants: [internal-browser]
    selector: about_open_terms
    flow: e2e/maestro/flows/suites/about-suite.yaml
    fixture_state: static
  - id: about.About.OpenPrivacyPolicy
    classification: user
    variants: [internal-browser]
    selector: about_open_privacy
    flow: e2e/maestro/flows/suites/about-suite.yaml
    fixture_state: static
  - id: about.About.OpenSupport
    classification: user
    variants: [internal-browser]
    selector: about_open_support
    flow: e2e/maestro/flows/suites/about-suite.yaml
    fixture_state: static
  - id: about.About.OpenUrl
    classification: user
    variants: [license-link, social-link, repository-link, dependency-link, special-thanks-link]
    selector: about_open_github
    flow: e2e/maestro/flows/suites/about-suite.yaml
    fixture_state: static
    platform_edge: direct external URL hand-off requires host/system assertion
  - id: about.About.RateOnStore
    classification: platform-edge
    variants: [store-intent]
    selector: about_rate_on_store
    flow: e2e/maestro/flows/suites/about-suite.yaml
    platform_edge: store intent requires host/system assertion
  - id: about.About.ReportBug
    classification: platform-edge
    variants: [mail-or-browser-intent]
    selector: about_report_bug
    flow: e2e/maestro/flows/suites/about-suite.yaml
    platform_edge: external composer/browser requires host/system assertion
  - id: about.About.ContactDeveloper
    classification: platform-edge
    variants: [mail-intent]
    selector: about_contact_developer
    flow: e2e/maestro/flows/suites/about-suite.yaml
    platform_edge: mail composer requires host/system assertion
  - id: about.About.ShareApp
    classification: platform-edge
    variants: [share-sheet]
    selector: about_share_app
    flow: e2e/maestro/flows/suites/about-suite.yaml
    platform_edge: share sheet requires UI Automator/XCUITest
  - id: about.About.SetUsageDataCollectionEnabled
    classification: user
    variants: [enable, disable]
    selector: about_usage_data_consent_toggle
    flow: e2e/maestro/flows/suites/about-suite.yaml
    fixture_state: static

  - id: auth.SignIn.SetUsbId
    classification: user
    variants: [valid-format, invalid-format]
    selector: auth_usb_id_text_field
    flow: e2e/maestro/flows/auth/login-success.yaml
    fixture_state: auth-success
  - id: auth.SignIn.SetPassword
    classification: user
    variants: [typed, hidden, visible]
    selector: auth_password_text_field
    flow: e2e/maestro/flows/auth/login-success.yaml
    fixture_state: auth-success
  - id: auth.SignIn.TogglePasswordVisibility
    classification: user
    variants: [show, hide]
    selector: auth_password_toggle
    flow: e2e/maestro/flows/auth/login-password-toggle.yaml
    fixture_state: static
  - id: auth.SignIn.SetUsageDataCollectionEnabled
    classification: user
    variants: [enable-before-login]
    selector: auth_usage_data_consent_checkbox
    flow: e2e/maestro/flows/auth/usage-data-consent.yaml
    fixture_state: auth-success
  - id: auth.SignIn.ClickSignIn
    classification: user
    variants: [success, invalid-credentials, disabled-account, connection-retry]
    selector: auth_sign_in_button
    flow: e2e/maestro/flows/auth/login-success.yaml
    fixture_state: auth-success
  - id: auth.SignIn.ClickTermsAndConditions
    classification: user
    variants: [internal-browser]
    selector: auth_terms_and_conditions_link
    flow: e2e/maestro/flows/auth/terms-privacy-from-login.yaml
    fixture_state: static
  - id: auth.SignIn.ClickPrivacyPolicy
    classification: user
    variants: [internal-browser]
    selector: auth_privacy_policy_link
    flow: e2e/maestro/flows/auth/terms-privacy-from-login.yaml
    fixture_state: static

  - id: auth.SignOut.Initialize
    classification: internal
    reason: route state bootstrap from pending changes
  - id: auth.SignOut.ConfirmSignOut
    classification: user
    variants: [plain-success, pending-flush-success, flush-failure]
    selector: base_confirmation_dialog_positive_button
    flow: e2e/maestro/flows/auth/sign-out.yaml
    fixture_state: auth-revoke-success
  - id: auth.SignOut.FlushAndSignOut
    classification: user
    variants: [pending-success, pending-failed, outdated-credentials]
    selector: base_confirmation_dialog_positive_button
    flow: e2e/maestro/flows/auth/pending-sign-out.yaml
    fixture_state: pending-evaluation-mutation
  - id: auth.SignOut.ForceSignOut
    classification: user
    variants: [force-after-flush-failed, force-after-outdated-credentials]
    selector: auth_sign_out_secondary_button
    flow: e2e/maestro/flows/auth/pending-sign-out.yaml
    fixture_state: pending-evaluation-mutation
  - id: auth.SignOut.OpenUpdatePassword
    classification: user
    variants: [outdated-credentials]
    selector: base_confirmation_dialog_positive_button
    flow: e2e/maestro/flows/auth/update-password.yaml
    fixture_state: auth-outdated-credentials

  - id: auth.UpdatePassword.SetPassword
    classification: user
    variants: [typed, empty]
    selector: auth_password_text_field
    flow: e2e/maestro/flows/auth/update-password.yaml
    fixture_state: update-password
  - id: auth.UpdatePassword.TogglePasswordVisibility
    classification: user
    variants: [show, hide]
    selector: auth_password_toggle
    flow: e2e/maestro/flows/auth/update-password.yaml
    fixture_state: update-password
  - id: auth.UpdatePassword.ClickSignIn
    classification: user
    variants: [success, failure, loading-disabled]
    selector: base_confirmation_dialog_positive_button
    flow: e2e/maestro/flows/auth/update-password.yaml
    fixture_state: update-password

  - id: enrollmentproof.Enrollment.FetchEnrollmentProof
    classification: user
    variants: [trigger, fetching-cancel, success-file-open, no-connection, timeout, unavailable, not-found, unsupported-file, outdated-credentials]
    selector: record_enrollment_proof_button
    flow: e2e/maestro/flows/suites/enrollmentproof-suite.yaml
    fixture_state: enrollment-proof-suite
    platform_edge: file opener success and unsupported-file host assertions require UI Automator/XCUITest

  - id: evaluations.Evaluation.LoadAvailableAttempts
    classification: internal
