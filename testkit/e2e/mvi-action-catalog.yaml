  - id: maincore.Browser.NavigateTo
    classification: internal
    reason: route effect from link actions
  - id: maincore.Browser.SetLoading
    classification: internal
    reason: renderer callback
  - id: maincore.Browser.OpenExternalResource
    classification: platform-edge
    variants: [cancel, confirm]
    selector: base_external_resource_message
    flow: e2e/maestro/flows/maincore/browser-external-dialog.yaml
    fixture_state: local-browser-pages
    platform_edge: confirm/open handoff requires UI Automator/XCUITest host assertion

  - id: maincore.Main.StartUp
    classification: internal
    reason: app bootstrap
  - id: maincore.Main.RequestReview
    classification: platform-edge
    variants: [review-prompt]
    selector: maincore_tuindice_nav_host
    flow: e2e/maestro/flows/summary/summary-smoke.yaml
    platform_edge: app store review prompt requires host/system assertion
  - id: maincore.Main.RequestUpdateCheck
    classification: platform-edge
    variants: [update-available, no-update]
    selector: maincore_tuindice_nav_host
    flow: e2e/maestro/flows/summary/summary-smoke.yaml
    platform_edge: system update prompt requires host/system assertion
  - id: maincore.Main.RequestSync
    classification: user
    variants: [success, outdated-credentials, unavailable]
    selector: summary_status_row
    flow: e2e/maestro/flows/summary/summary-smoke.yaml
    fixture_state: sync-success
  - id: maincore.Main.SetLastMainSection
    classification: user
    variants: [summary, record, pensum, evaluations, about]
    selector: maincore_tuindice_bottom_bar
    flow: e2e/maestro/flows/maincore/bottom-bar-state.yaml
    fixture_state: static
  - id: maincore.Main.RequestWizardStart
    classification: user
    variants: [first-launch, manual-start]
    selector: wizard_welcome_screen
    flow: e2e/maestro/flows/wizard/wizard-smoke.yaml
    fixture_state: first-launch

  - id: pensum.Pensum.ObservePensum
